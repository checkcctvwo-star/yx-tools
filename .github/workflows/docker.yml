name: Build Docker Image

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0 这样的 tag 时触发
    branches:
      - main  # 也可以在主分支推送时触发
  workflow_dispatch:  # 支持手动触发
    inputs:
      push_to_registry:
        description: 'Push to Docker Hub/GHCR'
        required: false
        default: 'true'
        type: boolean
      push_to_dockerhub:
        description: 'Also push to Docker Hub (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push_to_registry == 'true' || github.event.inputs.push_to_registry == null)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录到 Docker Hub
        if: github.event_name != 'pull_request' && (github.event.inputs.push_to_dockerhub == 'true' || (github.event.inputs.push_to_dockerhub == null && env.DOCKERHUB_USERNAME != ''))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # sha tag 只在推分支时带分支名前缀：tag 触发时 {{branch}} 为空，
      # 会生成 "-39355cf" 这种以 - 开头的非法 tag，导致整步失败
      - name: 提取元数据（GHCR 标签、摘要等）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=sha,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable={{is_default_branch}}
          # tag 不符合 semver 时（如 v3）不让整步失败
          flavor: |
            latest=auto

      - name: 构建并推送 Docker 镜像（GHCR，多架构）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_to_registry == 'true' || github.event.inputs.push_to_registry == null) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub 需要单独的 metadata：用户名未配置时整个步骤跳过，
      # 避免把空用户名拼进镜像名
      - name: 提取元数据（Docker Hub 标签）
        id: meta-dh
        if: github.event_name != 'pull_request' && (github.event.inputs.push_to_dockerhub == 'true' || (github.event.inputs.push_to_dockerhub == null && env.DOCKERHUB_USERNAME != ''))
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/yx-tools
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: 构建并推送 Docker 镜像（Docker Hub，多架构）
        if: github.event_name != 'pull_request' && (github.event.inputs.push_to_dockerhub == 'true' || (github.event.inputs.push_to_dockerhub == null && env.DOCKERHUB_USERNAME != ''))
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dh.outputs.tags }}
          labels: ${{ steps.meta-dh.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub 页面描述：内容源是 docs/dockerhub-readme.md，改了随时重跑本工作流即可
      - name: 更新 Docker Hub 仓库描述（README）
        if: github.event_name != 'pull_request' && (github.event.inputs.push_to_dockerhub == 'true' || (github.event.inputs.push_to_dockerhub == null && env.DOCKERHUB_USERNAME != ''))
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          BODY=$(python3 -c '
          import json
          desc = open("docs/dockerhub-readme.md", encoding="utf-8").read()
          print(json.dumps({
            "short_description": "Cloudflare 优选 IP 测速工具（内置网页界面与定时任务）",
            "full_description": desc
          }))
          ')
          curl -fsS -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DH_TOKEN" \
            -d "$BODY" \
            "https://hub.docker.com/v2/repositories/$DH_USERNAME/yx-tools/"
          echo ""
          echo "✅ Docker Hub 描述已更新（docs/dockerhub-readme.md）"

      - name: 显示镜像信息
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Docker镜像构建完成！"
          echo "📦 GHCR 镜像:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "🚀 运行容器:"
          echo "  docker run -d -p 8080:8080 \\"
          echo "    -v \$(pwd)/data:/data \\"
          echo "    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "🐳 Docker Hub 镜像（配置了 DOCKERHUB_USERNAME 时）:"
          echo "  docker pull docker.io/${{ env.DOCKERHUB_USERNAME }}/yx-tools:latest"
